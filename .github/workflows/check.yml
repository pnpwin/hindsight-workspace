name: Package checks
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
# Fork checks receive read access only; no event text is interpolated into shell commands.
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python, JSON and Node syntax
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          for path in Path('.').rglob('*'):
              if '.git' in path.parts or not path.is_file():
                  continue
              if path.suffix == '.py':
                  compile(path.read_bytes(), str(path), 'exec')
              elif path.suffix == '.json':
                  json.loads(path.read_text())
              elif path.suffix == '.mjs':
                  subprocess.run(['node', '--check', str(path)], check=True)
          PY
      - name: Version and marketplace agreement
        run: python3 -B scripts/check_release.py
      - name: Release contract regressions
        run: python3 -B scripts/test_release.py -v
